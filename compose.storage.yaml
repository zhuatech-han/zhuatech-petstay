# Optional dedicated host storage. Create an empty private directory before first startup.
# Use together with compose.yaml; never point a restore at an existing data directory.
services:
  mysql:
    volumes:
      - type: bind
        source: ${PETSTAY_MYSQL_DATA_DIR:?set an absolute dedicated data directory}
        target: /var/lib/mysql
